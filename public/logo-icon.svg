<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="gtx-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gtx-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="gtx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Badge Contour (Transparent background) -->
  <path d="M256 32 C330 32 410 60 432 76 C432 210 420 370 256 480 C92 370 80 210 80 76 C102 60 182 32 256 32 Z" 
        fill="url(#gtx-grad-1)" 
        opacity="0.15" />

  <!-- Shield Border Stroke -->
  <path d="M256 44 C322 44 394 70 414 84 C414 200 403 346 256 452 C109 346 98 200 98 84 C118 70 190 44 256 44 Z" 
        stroke="url(#gtx-grad-1)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Smartphone Escrow Frame Center -->
  <rect x="186" y="116" width="140" height="260" rx="28" 
        fill="none" 
        stroke="url(#gtx-grad-2)" 
        stroke-width="14" 
        filter="url(#gtx-glow)" />

  <!-- Speaker & Notch Bar -->
  <line x1="230" y1="138" x2="282" y2="138" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" />

  <!-- Stylized Monogram "X" Lock Core -->
  <path d="M216 200 L296 290 M296 200 L216 290" 
        stroke="url(#gtx-grad-2)" 
        stroke-width="18" 
        stroke-linecap="round" />

  <!-- Verified Checkmark Badge -->
  <circle cx="340" cy="340" r="36" fill="#10B981" />
  <path d="M324 340 L335 351 L358 328" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
